<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Break — Majd Hijazin</title>
<meta name="description" content="A hangman-style game built by Majd Hijazin. Guess the words behind his products, companies and stack — every solved word unlocks a career card.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#07040F">
<link rel="canonical" href="https://majdhijazin.com/hangman.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Majd Hijazin">
<meta property="og:url" content="https://majdhijazin.com/hangman.html">
<meta property="og:title" content="Signal Break — Majd Hijazin">
<meta property="og:description" content="Guess the words behind Majd Hijazin's products, companies and stack. Every solved word unlocks a career card.">
<meta property="og:image" content="https://majdhijazin.com/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07040F; --bg2:#0C0720; --glass:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.2);
  --ink:#F3F1FB; --dim:rgba(243,241,251,.62); --dim2:rgba(243,241,251,.38);
  --acc:#FF6A2B; --acc2:#FF3D71; --cy:#3DE0FF; --ok:#3BE38B; --bad:#FF4D5E;
  --f-d:'Rajdhani',sans-serif; --f-b:'Inter',system-ui,sans-serif; --f-m:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-b);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
body:before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(ellipse 55% 45% at 18% 8%,rgba(255,106,43,.20),transparent 62%),
   radial-gradient(ellipse 50% 42% at 84% 22%,rgba(61,224,255,.11),transparent 64%),
   radial-gradient(ellipse 60% 50% at 50% 100%,rgba(255,61,113,.11),transparent 66%)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;
  padding:20px clamp(14px,3.5vw,28px) 60px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);
  font-family:var(--f-d);font-weight:600;font-size:11px;letter-spacing:.28em;text-transform:uppercase;
  padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(12px);transition:.3s}
.back:hover{border-color:var(--acc);color:var(--acc)}
.top .ttl{font-family:var(--f-d);font-weight:700;font-size:clamp(17px,2.4vw,24px);
  letter-spacing:.24em;text-transform:uppercase;
  background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.icons{display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(12px);display:grid;place-items:center;font-size:15px;transition:.25s;color:var(--dim)}
.ibtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}
.ibtn[aria-pressed="true"]{color:var(--acc);border-color:var(--acc)}

/* ---------- modes ---------- */
.modes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.mode{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(10px);font-family:var(--f-d);font-weight:600;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--dim);transition:.28s}
.mode:hover{color:var(--ink);border-color:var(--line2)}
.mode.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0B0616;border-color:transparent;
  box-shadow:0 8px 26px rgba(255,106,43,.34)}

/* ---------- HUD ---------- */
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.stat{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(14px);position:relative;overflow:hidden}
.stat .k{font-family:var(--f-d);font-weight:600;font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--dim2)}
.stat .v{font-family:var(--f-d);font-weight:700;font-size:23px;line-height:1.1;margin-top:5px;
  display:flex;align-items:baseline;gap:6px}
.stat .v small{font-size:12px;color:var(--dim);font-weight:600}
.xpbar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:9px}
.xpbar i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.flame{color:var(--acc)}

/* ---------- board ---------- */
.board{border-radius:26px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(20px);padding:clamp(20px,3.4vw,34px);
  box-shadow:0 30px 70px rgba(0,0,0,.45);position:relative;overflow:hidden}
.board:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.06),transparent 34%)}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.chip{font-family:var(--f-d);font-weight:700;font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;border:1px solid rgba(255,106,43,.45);
  background:rgba(255,106,43,.13);color:var(--acc)}
.lives{display:flex;gap:6px;align-items:center}
.lives b{width:9px;height:9px;border-radius:50%;background:var(--acc);transition:.4s;
  box-shadow:0 0 12px rgba(255,106,43,.7)}
.lives b.gone{background:rgba(255,255,255,.14);box-shadow:none;transform:scale(.7)}
.timer{font-family:var(--f-m);font-size:14px;color:var(--cy);letter-spacing:.06em}
.timer.warn{color:var(--bad);animation:pulseT .7s ease-in-out infinite}
@keyframes pulseT{50%{opacity:.45}}

.hint{font-family:var(--f-d);font-weight:500;font-size:clamp(17px,2.3vw,25px);line-height:1.4;
  color:var(--ink);margin-bottom:6px}
.hint .q{color:var(--acc);margin-right:6px}
.sub{font-size:13px;color:var(--dim2);margin-bottom:20px;font-family:var(--f-m);letter-spacing:.04em}

.stage{display:grid;grid-template-columns:190px 1fr;gap:clamp(16px,3vw,32px);align-items:center;margin-bottom:24px}
@media(max-width:720px){.stage{grid-template-columns:1fr;gap:14px}}
#core{width:190px;height:190px;display:block;margin:0 auto;image-rendering:auto}
@media(max-width:720px){#core{width:150px;height:150px}}

.word{display:flex;flex-wrap:wrap;gap:clamp(6px,1.1vw,11px);justify-content:center}
.slot{width:clamp(30px,5.2vw,50px);height:clamp(42px,7vw,64px);border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);
  display:grid;place-items:center;font-family:var(--f-d);font-weight:700;
  font-size:clamp(20px,3.4vw,31px);position:relative;transition:.35s cubic-bezier(.2,.8,.2,1)}
.slot:after{content:'';position:absolute;left:22%;right:22%;bottom:8px;height:2px;
  background:rgba(255,255,255,.16);border-radius:2px;transition:.3s}
.slot.on{border-color:rgba(255,106,43,.55);background:rgba(255,106,43,.10);
  box-shadow:0 0 22px rgba(255,106,43,.2)}
.slot.on:after{opacity:0}
.slot.reveal{border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.10);color:#FFB3BA}
.slot.gap{border:0;background:none;width:clamp(12px,2vw,20px)}
.slot.gap:after{display:none}
.slot.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.6) rotateX(70deg);opacity:0}100%{transform:none;opacity:1}}

/* ---------- keyboard ---------- */
.kb{display:flex;flex-direction:column;gap:7px;align-items:center}
.krow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.key{width:clamp(30px,4.4vw,44px);height:clamp(38px,5.4vw,50px);border-radius:11px;
  border:1px solid var(--line);background:rgba(255,255,255,.045);backdrop-filter:blur(8px);
  font-family:var(--f-d);font-weight:700;font-size:clamp(13px,1.7vw,17px);color:var(--ink);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3),background .25s,border-color .25s,opacity .3s}
.key:hover:not(:disabled){transform:translateY(-3px);border-color:var(--acc);background:rgba(255,106,43,.14)}
.key:active:not(:disabled){transform:translateY(0) scale(.94)}
.key.hit{background:rgba(59,227,139,.18);border-color:rgba(59,227,139,.5);color:var(--ok)}
.key.miss{background:rgba(255,77,94,.14);border-color:rgba(255,77,94,.4);color:#FF8A96;opacity:.5}
.key:disabled{cursor:default;transform:none}
.key.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:18px;
  background:rgba(5,3,12,.82);backdrop-filter:blur(10px);overflow-y:auto;
  opacity:0;visibility:hidden;transition:.35s}
.ov.on{opacity:1;visibility:visible}
.card{width:min(560px,100%);border-radius:24px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(28,18,52,.96),rgba(10,6,22,.97));
  padding:clamp(22px,3.6vw,34px);box-shadow:0 40px 90px rgba(0,0,0,.6);margin:auto;
  transform:translateY(18px) scale(.97);transition:.45s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.ov.on .card{transform:none}
.card:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.07),transparent 36%)}
.verdict{font-family:var(--f-d);font-weight:700;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;margin-bottom:12px}
.verdict.win{color:var(--ok)}
.verdict.lose{color:var(--bad)}
.card h2{font-family:var(--f-d);font-weight:700;text-transform:uppercase;
  font-size:clamp(28px,5vw,46px);line-height:1;letter-spacing:.02em;margin-bottom:6px}
.card .cat{font-family:var(--f-d);font-weight:600;font-size:10.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--acc);margin-bottom:16px}
.card .desc{font-size:15.5px;line-height:1.65;color:var(--dim);margin-bottom:18px}
.tech{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.tech span{font-family:var(--f-m);font-size:12px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim)}
.rowb{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 24px;border-radius:14px;font-family:var(--f-d);font-weight:700;font-size:12px;
  letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:.3s;flex:1;min-width:150px}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0B0616;
  box-shadow:0 10px 30px rgba(255,106,43,.32)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(255,106,43,.44)}
.btn.gho{border:1px solid var(--line2);color:var(--ink)}
.btn.gho:hover{border-color:var(--acc);color:var(--acc)}
.xpline{display:flex;align-items:center;gap:10px;margin-bottom:18px;
  font-family:var(--f-d);font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.xpline b{color:var(--acc);font-size:16px}

/* ---------- collection ---------- */
.sheet{width:min(880px,100%);max-height:86vh;overflow-y:auto}
.sheet h3{font-family:var(--f-d);font-weight:700;font-size:clamp(20px,3vw,30px);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.sheet .sub2{font-size:13.5px;color:var(--dim2);margin-bottom:20px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.ccard{border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;transition:.3s}
.ccard.got{border-color:rgba(255,106,43,.4);background:rgba(255,106,43,.08)}
.ccard.got:hover{transform:translateY(-3px);border-color:var(--acc)}
.ccard .cn{font-family:var(--f-d);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.ccard .cc{font-family:var(--f-d);font-weight:600;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim2);margin-top:auto;padding-top:8px}
.ccard.locked .cn{color:var(--dim2);letter-spacing:.24em}
.badges{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
.badge{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);min-width:190px;flex:1;opacity:.4;transition:.3s}
.badge.got{opacity:1;border-color:rgba(255,106,43,.4);background:rgba(255,106,43,.08)}
.badge .bi{font-size:19px}
.badge .bt{font-family:var(--f-d);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.badge .bd{font-size:11.5px;color:var(--dim2);margin-top:2px;line-height:1.4}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0 4px}
.sblock{padding:14px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.sblock b{display:block;font-family:var(--f-d);font-weight:700;font-size:22px}
.sblock span{font-family:var(--f-d);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2)}
.secH{font-family:var(--f-d);font-weight:700;font-size:11px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--dim2);margin:22px 0 10px}
.closeX{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;
  border:1px solid var(--line);background:rgba(0,0,0,.4);font-size:17px;color:var(--dim);z-index:3}
.closeX:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;
  display:flex;gap:11px;align-items:center;padding:13px 20px;border-radius:14px;
  border:1px solid rgba(255,106,43,.5);background:rgba(16,9,32,.96);backdrop-filter:blur(12px);
  box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.4s cubic-bezier(.2,.8,.2,1)}
#toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
#toast .ti{font-size:20px}
#toast .tt{font-family:var(--f-d);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#toast .td{font-size:12px;color:var(--dim2);margin-top:2px}
#fx{position:fixed;inset:0;z-index:85;pointer-events:none}

/* ---------- footer ---------- */
.foot{margin-top:26px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-family:var(--f-d);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim2)}
.foot a{color:var(--dim);text-decoration:none}
.foot a:hover{color:var(--acc)}

@media(max-width:600px){
  .wrap{padding-top:14px}
  .top{margin-bottom:14px}
  .top .ttl{font-size:15px;letter-spacing:.16em}
  .back{padding:9px 13px;font-size:9.5px;letter-spacing:.18em}
  .modes{margin-bottom:12px;gap:6px}
  .mode{padding:8px 13px;font-size:10px;letter-spacing:.12em}
  /* three across keeps the board above the fold */
  .hud{grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
  .stat{padding:10px 11px;border-radius:13px}
  .stat .k{font-size:8px;letter-spacing:.16em}
  .stat .v{font-size:17px;margin-top:3px}
  .stat .v small{font-size:10px}
  .xpbar{margin-top:6px;height:4px}
  .board{padding:16px 14px}
  .hint{font-size:16px}
  .sub{font-size:11.5px;margin-bottom:14px}
  .stage{margin-bottom:16px}
  .board{border-radius:20px}
  /* 10 keys must fit one row at 390px */
  .kb{gap:6px}
  .krow{gap:4px}
  .key{width:28px;height:40px;border-radius:9px;font-size:14px}
  .slot{width:28px;height:38px;font-size:19px;border-radius:9px}
  .slot.gap{width:9px}
  .btn{min-width:100%}
}
@media(max-width:380px){
  .krow{gap:3px}
  .key{width:26px;height:37px;font-size:13px}
  .slot{width:25px;height:34px;font-size:17px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="top">
    <a class="back" href="games.html">&#8592; All games</a>
    <div class="ttl">Signal Break</div>
    <div class="icons">
      <button class="ibtn" id="bColl" title="Collection" aria-label="Open collection">&#9635;</button>
      <button class="ibtn" id="bStats" title="Stats &amp; badges" aria-label="Open stats">&#9679;</button>
      <button class="ibtn" id="bSound" title="Sound" aria-label="Toggle sound" aria-pressed="false">&#9834;</button>
    </div>
  </div>

  <div class="modes" role="tablist" aria-label="Game mode">
    <button class="mode on" data-mode="classic" role="tab" aria-selected="true">Classic</button>
    <button class="mode" data-mode="time" role="tab" aria-selected="false">Time Attack</button>
    <button class="mode" data-mode="hard" role="tab" aria-selected="false">Hard</button>
    <button class="mode" data-mode="daily" role="tab" aria-selected="false">Daily</button>
  </div>

  <div class="hud">
    <div class="stat"><div class="k">Level</div><div class="v" id="hLvl">1</div><div class="xpbar"><i id="hXp"></i></div></div>
    <div class="stat"><div class="k">Streak</div><div class="v"><span class="flame">&#9650;</span><span id="hStreak">0</span></div></div>
    <div class="stat"><div class="k">Combo</div><div class="v" id="hCombo">&times;1</div></div>
    <div class="stat"><div class="k">Accuracy</div><div class="v" id="hAcc">—<small>%</small></div></div>
    <div class="stat"><div class="k">Collected</div><div class="v" id="hColl">0<small id="hCollT">/0</small></div></div>
  </div>

  <main class="board" aria-live="polite">
    <div class="bhead">
      <span class="chip" id="cat">Project</span>
      <div style="display:flex;gap:14px;align-items:center">
        <span class="timer" id="timer" hidden>0:60</span>
        <div class="lives" id="lives" aria-label="Guesses remaining"></div>
      </div>
    </div>

    <div class="hint"><span class="q">&ldquo;</span><span id="hint"></span><span class="q">&rdquo;</span></div>
    <div class="sub" id="sub"></div>

    <div class="stage">
      <canvas id="core" width="380" height="380" aria-hidden="true"></canvas>
      <div class="word" id="word"></div>
    </div>

    <div class="kb" id="kb"></div>
  </main>

  <div class="foot">
    <span id="fStats">0 played</span>
    <span><a href="index.html">Majd Hijazin</a> &middot; <a href="games.html">Games</a></span>
  </div>
</div>

<!-- result -->
<div class="ov" id="res" role="dialog" aria-label="Round result">
  <div class="card">
    <div class="verdict" id="vd">Signal restored</div>
    <h2 id="rName"></h2>
    <div class="cat" id="rCat"></div>
    <div class="xpline" id="rXp"></div>
    <p class="desc" id="rDesc"></p>
    <div class="tech" id="rTech"></div>
    <div class="rowb">
      <a class="btn pri" id="rLink" target="_blank" rel="noopener">View project</a>
      <button class="btn gho" id="rNext">Keep playing</button>
    </div>
  </div>
</div>

<!-- collection -->
<div class="ov" id="coll" role="dialog" aria-label="Collection">
  <div class="card sheet">
    <button class="closeX" data-close>&times;</button>
    <h3>Career cards</h3>
    <div class="sub2" id="collSub"></div>

/* =========================== state =========================== */
var S = {
  mode:'classic', word:null, masked:[], guessed:{}, wrong:0, lives:6,

         got:{}, badges:{}, sound:false, daily:null }
};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function letters(w){ return w.replace(/[^A-Z]/g,''); }
function uniq(w){ var o={},a=[],L=letters(w); for(var i=0;i<L.length;i++) if(!o[L[i]]){o[L[i]]=1;a.push(L[i]);} return a; }

function load(){
  try{ var r=localStorage.getItem(CONFIG.key); if(r){ var o=JSON.parse(r); for(var k in o) S.save[k]=o[k]; } }catch(e){}
}
function save(){ try{ localStorage.setItem(CONFIG.key, JSON.stringify(S.save)); }catch(e){} }

function level(){ return Math.floor(S.save.xp / CONFIG.levelStep) + 1; }
function levelPct(){ return Math.round((S.save.xp % CONFIG.levelStep) / CONFIG.levelStep * 100); }
function combo(){ var s=S.save.streak; return s>=7?3 : s>=4?2 : s>=2?1.5 : 1; }
function accuracy(){ return S.save.tries ? Math.round(S.save.hits/S.save.tries*100) : null; }
function collected(){ var n=0; for(var k in S.save.got) n++; return n; }

/* =========================== audio =========================== */
var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } return AC; }
function beep(f,d,type,v){
  if(!S.save.sound) return; var a=ac(); if(!a) return;
  try{
    if(a.state==='suspended') a.resume();
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    o.connect(g); g.connect(a.destination);
    var t=a.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v||0.05,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.12));
    o.start(t); o.stop(t+(d||0.12)+0.03);
  }catch(e){}
}
function chord(fs,d,type,v){ fs.forEach(function(f,i){ setTimeout(function(){ beep(f,d,type,v); }, i*70); }); }

/* =========================== ambient stars =========================== */
(function stars(){
  var c=$('stars'), x=c.getContext('2d'), pts=[];
  function size(){ c.width=innerWidth; c.height=innerHeight;
    pts=[]; var n=Math.min(90,Math.round(innerWidth/16));
    for(var i=0;i<n;i++) pts.push({x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.5+.3,s:Math.random()*.16+.03,a:Math.random()});
  }
  size(); addEventListener('resize',size);
  (function loop(){
    requestAnimationFrame(loop);
    x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<pts.length;i++){
      var p=pts[i]; p.y-=p.s; if(p.y<-4){ p.y=c.height+4; p.x=Math.random()*c.width; }
      p.a+=0.012;
      x.globalAlpha=0.18+Math.sin(p.a)*0.16;
      x.fillStyle= i%7===0 ? '#FF6A2B' : '#9FD9FF';
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fill();
    }
    x.globalAlpha=1;
  })();
})();

/* =========================== the core (failure visual) =========================== */
var coreC=$('core'), cx=coreC.getContext('2d'), coreT=0, shake=0;
function drawCore(){
  requestAnimationFrame(drawCore);
  coreT+=0.016; if(shake>0) shake=Math.max(0,shake-0.03);
  var W=380,H=380, cxp=W/2, cyp=H/2;
  cx.setTransform(1,0,0,1,0,0);
  cx.clearRect(0,0,W,H);
  var dmg = S.lives? (S.wrong/S.lives) : 0;
  var dead = S.wrong>=S.lives;
  cx.save();
  if(shake>0) cx.translate((Math.random()-.5)*shake*26,(Math.random()-.5)*shake*26);

  /* outer rings — they break apart as damage rises */
  for(var r=0;r<3;r++){
    var rad=118-r*26, segs=[10,8,6][r];
    var broken=Math.floor(dmg*segs);
    for(var s=0;s<segs;s++){
      if(s<broken) continue;
      var a0=(s/segs)*6.283 + coreT*(r%2?-0.22:0.3) + r,
          a1=a0+(6.283/segs)*0.72;
      cx.beginPath(); cx.arc(cxp,cyp,rad,a0,a1);
      cx.lineWidth=r===0?3:2;
      cx.strokeStyle= dead? 'rgba(255,77,94,.55)' :
        (r===0?'rgba(255,106,43,'+(0.85-dmg*0.4)+')':'rgba(61,224,255,'+(0.45-dmg*0.25)+')');
      cx.stroke();
    }
  }
  /* core body */
  var pulse=1+Math.sin(coreT*2.4)*0.04*(1-dmg);
  var R=42*pulse;
  var g=cx.createRadialGradient(cxp,cyp,2,cxp,cyp,R*1.9);
  if(dead){ g.addColorStop(0,'rgba(255,77,94,.9)'); g.addColorStop(1,'rgba(255,77,94,0)'); }
  else { g.addColorStop(0,'rgba(255,190,120,'+(1-dmg*0.5)+')');
         g.addColorStop(.45,'rgba(255,106,43,'+(0.75-dmg*0.4)+')');
         g.addColorStop(1,'rgba(255,106,43,0)'); }
  cx.fillStyle=g; cx.beginPath(); cx.arc(cxp,cyp,R*1.9,0,6.283); cx.fill();

  /* hexagon shell, fracturing */
  cx.beginPath();
  for(var i=0;i<6;i++){
    var an=(i/6)*6.283 + coreT*0.12;
    var jitter = dmg>0 ? (Math.random()-.5)*dmg*9 : 0;
    var px=cxp+Math.cos(an)*(R+jitter), py=cyp+Math.sin(an)*(R+jitter);
    i? cx.lineTo(px,py) : cx.moveTo(px,py);
  }
  cx.closePath();
  cx.lineWidth=2.5;
  cx.strokeStyle= dead?'rgba(255,77,94,.9)':'rgba(255,220,190,'+(0.9-dmg*0.35)+')';
  cx.stroke();

  /* shards fly off with each break */
  var shards=Math.floor(dmg*14);
  for(var k=0;k<shards;k++){
    var sa=(k/14)*6.283+coreT*0.5, sd=R+22+((k*37)%50)+Math.sin(coreT+k)*6;
    cx.save(); cx.globalAlpha=0.5;
    cx.translate(cxp+Math.cos(sa)*sd, cyp+Math.sin(sa)*sd); cx.rotate(sa+coreT);
    cx.fillStyle= dead?'rgba(255,77,94,.8)':'rgba(255,106,43,.7)';
    cx.fillRect(-3,-1.5,7,3); cx.restore();
  }
  cx.restore();
}
requestAnimationFrame(drawCore);

/* =========================== confetti =========================== */
var fxC=$('fx'), fx=fxC.getContext('2d'), bits=[];
function fxSize(){ fxC.width=innerWidth; fxC.height=innerHeight; }
fxSize(); addEventListener('resize',fxSize);
function burst(){
  var cols=['#FF6A2B','#FF3D71','#3DE0FF','#3BE38B','#FFD36A','#FFFFFF'];
  for(var i=0;i<130;i++){
    bits.push({x:innerWidth/2+(Math.random()-.5)*220, y:innerHeight*0.42,
      vx:(Math.random()-.5)*13, vy:-Math.random()*15-4,
      w:5+Math.random()*7, h:3+Math.random()*6, r:Math.random()*6.28,
      vr:(Math.random()-.5)*0.4, c:cols[(Math.random()*cols.length)|0], l:1});
  }
}
(function fxLoop(){
  requestAnimationFrame(fxLoop);
  fx.clearRect(0,0,fxC.width,fxC.height);
  for(var i=bits.length-1;i>=0;i--){
    var b=bits[i];
    b.vy+=0.42; b.x+=b.vx; b.y+=b.vy; b.r+=b.vr; b.l-=0.008;
    if(b.l<=0||b.y>fxC.height+40){ bits.splice(i,1); continue; }
    fx.save(); fx.globalAlpha=Math.max(0,b.l); fx.translate(b.x,b.y); fx.rotate(b.r);
    fx.fillStyle=b.c; fx.fillRect(-b.w/2,-b.h/2,b.w,b.h); fx.restore();
  }
})();

function renderHud(){

  for(var i=0;i<S.lives;i++) h+='<b class="'+(i<S.wrong?'gone':'')+'"></b>';

function renderWord(pop){
  var w=S.word.w, h='';
  for(var i=0;i<w.length;i++){
    var ch=w[i];
    if(ch===' '){ h+='<span class="slot gap"></span>'; continue; }
    var shown=S.guessed[ch];
    var cls='slot'+(shown?' on':'')+(S.over&&!shown?' reveal':'')+(pop===ch?' pop':'');
    h+='<span class="'+cls+'">'+((shown||S.over)?ch:'')+'</span>';
  }
  $('word').innerHTML=h;
}
var ROWS=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
function renderKb(){
  var h='';
  for(var r=0;r<ROWS.length;r++){
    h+='<div class="krow">';
    for(var i=0;i<ROWS[r].length;i++){
      var c=ROWS[r][i], st=S.guessed[c]===true?'hit':(S.guessed[c]===false?'miss':'');
      h+='<button class="key '+st+'" data-k="'+c+'" '+(st||S.over?'disabled':'')+
         ' aria-label="Guess '+c+'">'+c+'</button>';
    }
    h+='</div>';
  }
  $('kb').innerHTML=h;
}
function toast(icon,title,desc){
  $('toastI').innerHTML=icon; $('toastT').textContent=title; $('toastD').textContent=desc||'';
  var t=$('toast'); t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },2600);
}

/* =========================== rounds =========================== */
function pool(){
  var unsolved=WORDS.filter(function(x){ return !S.save.got[x.w]; });
  return unsolved.length? unsolved : WORDS;
}
function dailyIndex(){
  var d=new Date(), key=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  var n=key; n=(n*9301+49297)%233280;
  return n % WORDS.length;
}
function newRound(){
  var list=pool();
  if(S.mode==='daily'){ S.word=WORDS[dailyIndex()]; }
  else { S.word=list[(Math.random()*list.length)|0]; }
  S.guessed={}; S.wrong=0; S.over=false; S.roundWrong=0;
  S.lives=CONFIG.lives[S.mode]||6;
  $('cat').textContent=S.word.cat;
  $('hint').textContent=S.word.hint;
  var L=letters(S.word.w).length;
  $('sub').textContent=L+' letters \u00b7 '+uniq(S.word.w).length+' unique \u00b7 '+
    (S.mode==='hard'?'hard mode':S.mode==='time'?'time attack':S.mode==='daily'?'daily challenge':'classic');
  renderLives(); renderWord(); renderKb(); renderHud();
  if(S.mode==='daily' && S.save.daily===todayKey()){
    toast('\u25D4','Daily already solved','Come back tomorrow, or switch mode.');
  }
}
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

function guess(ch){
  if(S.over || S.guessed[ch]!==undefined) return;
  var hit = letters(S.word.w).indexOf(ch)>=0;
  S.guessed[ch]=hit;
  S.save.tries++; if(hit) S.save.hits++;
  if(hit){
    beep(660+Math.random()*120,.10,'triangle',.05);
    renderWord(ch);
  } else {
    S.wrong++; S.roundWrong++; shake=1;
    beep(150,.22,'sawtooth',.06);
    var k=document.querySelector('.key[data-k="'+ch+'"]');
    if(k) { k.classList.add('shake'); setTimeout(function(){ k.classList.remove('shake'); },420); }
    renderLives();
  }
  renderKb(); renderHud(); save();
  var done = uniq(S.word.w).every(function(c){ return S.guessed[c]===true; });
  if(done) return finish(true);
  if(S.wrong>=S.lives) return finish(false);
}

function finish(won){
  S.over=true; renderWord(); renderKb();
  S.save.played++;
  var gained=0;
  if(won){
    S.save.wins++;
    S.save.streak++;
    if(S.save.streak>S.save.best) S.save.best=S.save.streak;
    gained = Math.round((CONFIG.xp.base + (S.lives-S.wrong)*CONFIG.xp.perLife + S.save.streak*CONFIG.xp.streak) * combo());
    S.save.xp += gained;
    S.save.got[S.word.w]=1;
    if(S.mode==='daily') S.save.daily=todayKey();
    if(S.mode==='time'){ S.timeSolved++; S.timeLeft+=CONFIG.timeBonus; }
    burst(); chord([523,659,784,1046],.18,'triangle',.05);
  } else {
    S.save.streak=0;
    beep(90,.5,'sawtooth',.07);
    if(S.mode==='time') stopTimer();
  }
  save(); renderHud(); checkBadges(won);
  showResult(won,gained);
}

function showResult(won,gained){
  var w=S.word;
  $('vd').textContent = won? 'Signal restored' : 'Signal lost';
  $('vd').className = 'verdict '+(won?'win':'lose');
  $('rName').textContent=w.w;
  $('rCat').textContent=w.cat;
  $('rDesc').textContent=w.desc;
  $('rTech').innerHTML=w.tech.map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('');
  $('rXp').innerHTML = won
    ? '<span>+</span><b>'+gained+' XP</b><span>\u00b7 combo \u00d7'+combo()+' \u00b7 streak '+S.save.streak+'</span>'
    : '<span>Streak reset \u00b7 the card is yours to read anyway</span>';
  var lk=$('rLink');
  if(w.link){ lk.href=w.link; lk.hidden=false; } else { lk.hidden=true; }
  $('res').classList.add('on');
  setTimeout(function(){ $('rNext').focus(); },420);
}

/* =========================== badges =========================== */
function award(id){
  if(S.save.badges[id]) return;
  var b=BADGES.filter(function(x){ return x.id===id; })[0]; if(!b) return;
  S.save.badges[id]=1; save();
  setTimeout(function(){ toast(b.i,'Badge unlocked',b.t+' \u2014 '+b.d); }, 700);
}
function checkBadges(won){
  if(!won) return;
  award('first');
  if(S.save.streak>=3) award('streak3');
  if(S.save.streak>=7) award('streak7');
  if(S.roundWrong===0) award('perfect');
  if(S.mode==='hard') award('hard');
  if(S.mode==='time' && S.timeSolved>=5) award('time');
  var n=collected();
  if(n>=10) award('ten');
  if(n>=WORDS.length) award('all');
  var cats={}, have={};
  WORDS.forEach(function(x){ cats[x.cat]=1; if(S.save.got[x.w]) have[x.cat]=1; });
  if(Object.keys(cats).length===Object.keys(have).length) award('cats');
}

/* =========================== time attack =========================== */
function startTimer(){
  stopTimer();
  S.timeLeft=CONFIG.timeStart; S.timeSolved=0;
  $('timer').hidden=false; tick();
  S.timer=setInterval(tick,1000);
}
function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } $('timer').hidden=true; }
function tick(){
  var t=$('timer');
  t.textContent = Math.floor(S.timeLeft/60)+':'+String(S.timeLeft%60).padStart(2,'0');
  t.classList.toggle('warn', S.timeLeft<=10);
  if(S.timeLeft<=0){ stopTimer(); if(!S.over) finish(false); return; }
  S.timeLeft--;
}

/* =========================== sheets =========================== */
function openColl(){
  var got=collected();
  $('collSub').textContent = got+' of '+WORDS.length+' collected \u00b7 '+
    Math.round(got/WORDS.length*100)+'% complete';
  $('cgrid').innerHTML = WORDS.map(function(w){
    var have=!!S.save.got[w.w];
    return '<div class="ccard '+(have?'got':'locked')+'">'+
      '<div class="cn">'+(have?esc(w.w):'\u2022 '.repeat(Math.min(6,letters(w.w).length)).trim())+'</div>'+
      '<div class="cc">'+(have?esc(w.cat):'Locked')+'</div></div>';
  }).join('');
  $('coll').classList.add('on');
}
function openStats(){
  var a=accuracy();
  $('sgrid').innerHTML=
    blk(S.save.played,'Games played')+blk(S.save.wins,'Solved')+
    blk(a===null?'—':a+'%','Accuracy')+blk(S.save.best,'Longest streak')+
    blk(level(),'Level')+blk(S.save.xp,'Total XP');
  $('bgrid').innerHTML = BADGES.map(function(b){
    return '<div class="badge '+(S.save.badges[b.id]?'got':'')+'">'+
      '<span class="bi">'+b.i+'</span><div><div class="bt">'+b.t+'</div><div class="bd">'+b.d+'</div></div></div>';
  }).join('');
  $('stats').classList.add('on');
}
function blk(v,l){ return '<div class="sblock"><b>'+v+'</b><span>'+l+'</span></div>'; }

/* =========================== wiring =========================== */
document.addEventListener('click',function(e){
  var k=e.target.closest('.key');
  if(k && !k.disabled){ guess(k.dataset.k); return; }
  var m=e.target.closest('.mode');
  if(m){
    S.mode=m.dataset.mode;
    [].forEach.call(document.querySelectorAll('.mode'),function(b){
      var on=b===m; b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on));
    });
    $('res').classList.remove('on');
    if(S.mode==='time') startTimer(); else stopTimer();
    newRound();
    return;
  }
  if(e.target.closest('[data-close]')){ e.target.closest('.ov').classList.remove('on'); return; }
  if(e.target.closest('.ov') && !e.target.closest('.card')){ e.target.closest('.ov').classList.remove('on'); }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    [].forEach.call(document.querySelectorAll('.ov.on'),function(o){ o.classList.remove('on'); });
    return;
  }
  if($('res').classList.contains('on')){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); next(); }
    return;
  }
  var c=(e.key||'').toUpperCase();
  if(c.length===1 && c>='A' && c<='Z'){ guess(c); }
});
function next(){
  $('res').classList.remove('on');
  if(S.mode==='time' && !S.timer) startTimer();
  setTimeout(newRound,240);
}
$('rNext').addEventListener('click',next);
$('bColl').addEventListener('click',openColl);
$('bStats').addEventListener('click',openStats);
$('bSound').addEventListener('click',function(){
  S.save.sound=!S.save.sound; save();
  this.setAttribute('aria-pressed',String(S.save.sound));
  this.innerHTML = S.save.sound? '\u266B' : '\u266A';
  if(S.save.sound){ ac(); beep(700,.09,'triangle',.05); }
});
$('bReset').addEventListener('click',function(){
  if(!confirm('Reset all progress on this browser?')) return;
  S.save={ xp:0,streak:0,best:0,played:0,wins:0,hits:0,tries:0,got:{},badges:{},sound:S.save.sound,daily:null };
  save(); renderHud(); openStats(); newRound();
});

/* sibling links work on a static host and inside the Aside preview */
(function(){
  var m=location.search.match(/[?&]path=([^&]+)/); if(!m) return;
  var dir=decodeURIComponent(m[1]).replace(/[^/]+$/,'');
  [].forEach.call(document.querySelectorAll('a[href$=".html"]'),function(a){
    a.href=location.pathname+location.search.replace(/path=[^&]*/,'path='+encodeURIComponent(dir+a.getAttribute('href')));
  });
})();

load();
$('bSound').setAttribute('aria-pressed',String(S.save.sound));
$('bSound').innerHTML = S.save.sound? '\u266B' : '\u266A';
$('hCollT').textContent='/'+WORDS.length;
renderHud();
newRound();
</script>

</body>
